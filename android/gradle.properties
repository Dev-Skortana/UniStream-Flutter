org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Jetifier (conversion des vieilles bibliothèques « support » vers AndroidX) ne sait pas lire
# les classes Java 21 : bcprov 1.80 (dépendance de test de shared_preferences_android) le fait
# planter (« Unsupported class file major version 65 »). Bouncy Castle n'a rien à convertir.
# À terme : android.enableJetifier=false (toutes les dépendances actuelles sont en AndroidX).
android.jetifier.ignorelist=bcprov-jdk18on
