name: unistream
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+1

environment:
  sdk: ^3.6.0

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.3.0
  # Son d'ouverture (lib/Views/Helpers/Son_Demarrage.dart).
  # 6.7+ exige Flutter 3.35+, 6.8+ Flutter 3.44+ : ^6.6.0 reste en 6.6.x avec Flutter 3.32.
  audioplayers: ^6.6.0

dependency_overrides:
  path: ^1.9.1

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  provider:
  path_provider: ^2.1.5
  sqflite: ^2.4.1
  # ── TEST LOCAL (08/11/2026) : package modifié sur le PC, sans passer par GitHub ──
  # Pour revenir au dépôt : remettre le bloc « git » ci-dessous et supprimer la ligne « path ».
  gathering_datas_videos_from_web:
    path: C:\Users\spart\OneDrive\Bureau\Developpements IT\visual-studio-projects\unistream_packages\packages\gathering_datas_videos_from_web
  #  git:
  #    url:  https://github.com/Dev-Skortana/unistream_packages.git
  #    path: packages/gathering_datas_videos_from_web
  # Non modifié : reste sur GitHub. Pour le charger en local aussi, remplacer le bloc « git »
  # par « path: <dossier local>/gathering_urls_videos_from_web ».
  gathering_urls_videos_from_web:
    path: C:\Users\spart\OneDrive\Bureau\Developpements IT\visual-studio-projects\unistream_packages\packages\gathering_urls_videos_from_web

    #git:
     # url:  https://github.com/Dev-Skortana/unistream_packages.git
      #path: packages/gathering_urls_videos_from_web
  dio: ^5.8.0+1
  permission_handler: ^12.0.0+1
  sqflite_common_ffi: ^2.3.4+4
  nameof_annotation: ^0.2.1
  flutter_inappwebview: ^6.1.5
  # Plafonné : puppeteer 3.20.0 et suivants exigent Dart 3.9 (SDK actuel : Dart 3.8).
  # Ce paquet est dans dependency_overrides : pub n'y vérifie pas la compatibilité
  # avec le SDK, il faut donc la borne haute à la main.
  puppeteer: ">=3.18.0 <3.20.0"
  http: ^1.4.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter 
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: 2.4.7   # 2.4.8 demande un Flutter plus récent
  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13   # ← Downgrade de ^2.4.15 à ^2.4.13
  nameof: ^0.2.2

# ── Icônes et écran natif ──
# Images générées par utils/logo/generer_assets_logo.py (une seule géométrie pour tout).
# Après modification : dart run flutter_launcher_icons  puis  dart run flutter_native_splash:create
flutter_launcher_icons:
  android: "launcher_icon"
  min_sdk_android: 21
  image_path_android: "assets/images/Ressources/logo/icone_android.png"
  adaptive_icon_background: "assets/images/Ressources/logo/icone_fond.png"
  adaptive_icon_foreground: "assets/images/Ressources/logo/icone_avant_plan.png"
  # Le signe est déjà réduit à la zone sûre : pas de marge supplémentaire (16 % par défaut).
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: "assets/images/Ressources/logo/icone_monochrome.png"
  ios: true
  image_path_ios: "assets/images/Ressources/logo/icone_ios.png"
  remove_alpha_ios: true
  image_path: "assets/images/Ressources/logo/icone_ios.png"
  windows:
    generate: true
    image_path: "assets/images/Ressources/logo/icone_bureau.png"
    icon_size: 256
  macos:
    generate: true
    image_path: "assets/images/Ressources/logo/icone_bureau.png"

# Écran natif : disque du logo sans les perles, sur le fond de l'appli (clair / sombre).
# Les couleurs sont reprises dans lib/Views/Splash/View_Splash.dart (passage invisible).
flutter_native_splash:
  color: "#FBF8FF"
  color_dark: "#0F1015"
  image: assets/images/Ressources/logo/splash_logo.png
  android_12:
    image: assets/images/Ressources/logo/splash_android12.png
    color: "#FBF8FF"
    color_dark: "#0F1015"
  web: false

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/video_posters/
    - assets/images/Ressources/
    - assets/raw/
    - assets/sons/
  fonts:
    # Police arrondie des titres (M PLUS Rounded 1c, OFL, réduite aux
    # caractères latins : ~68 Ko par graisse au lieu de 3,5 Mo).
    - family: MPLUSRounded1c
      fonts:
        - asset: assets/fonts/MPLUSRounded1c-Bold.ttf
          weight: 700
        - asset: assets/fonts/MPLUSRounded1c-ExtraBold.ttf
          weight: 800

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package
